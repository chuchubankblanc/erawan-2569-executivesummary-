<script>
/* minimal stand-in for the Claude Dashboard `dash` API: loads data/<id>.json */
(function () {
  const ids = ['cases', 'traits', 'units', 'zones', 'screening', 'unitstats', 'hospstats', 'codes'];
  const state = {};
  const subs = [];
  const fire = () => subs.forEach((fn) => fn());
  ids.forEach((id) => {
    state[id] = { status: 'loading', data: [] };
    fetch('data/' + id + '.json', { cache: 'no-cache' })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((d) => { state[id] = { status: 'ok', data: d }; fire(); })
      .catch((e) => { state[id] = { status: 'error', data: [], message: String(e) }; fire(); });
  });
  let t;
  window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(fire, 150); });
  window.dash = {
    data: (id) => state[id] || { status: 'missing', data: [] },
    onData: (fn) => { subs.push(fn); fn(); }
  };
})();
</script>
